{{- /* One row of photos and videos at equal height. Expects dict: page, images (slice of filenames), width ("narrow" or empty) */ -}}
{{- $page := .page -}}
<div class="sequence-row{{ if eq .width "narrow" }} sequence-row--narrow{{ end }}">
  {{- range .images }}
    <div class="sequence-item" style="--r: {{ printf "%.4f" (partial "media-ratio" (dict "page" $page "name" .)) }}">
      {{ partial "media" (dict "page" $page "name" .) }}
    </div>
  {{- end }}
</div>
