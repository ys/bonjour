name: Daily rebuild

# Rebuilds the site every morning through a Vercel deploy hook, without a commit.
# Needs the VERCEL_DEPLOY_HOOK secret (Vercel > Settings > Git > Deploy Hooks).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # Daily at 6am UTC

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::VERCEL_DEPLOY_HOOK secret is missing"; exit 1; fi
          curl -fsS -X POST "$HOOK"
