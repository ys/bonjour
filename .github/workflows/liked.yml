name: Liked

on:
  push:
    paths:
      - .github/workflows/liked.yml # Only run a new workflow every time this file (flat.yaml) file changes
  workflow_dispatch: # Required even though this is currently empty
  schedule:
    - cron: "0 5 * * *" # Daily at 5am UTC

jobs:
  liked:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Fetch liked
        run: deno run --allow-net=api.raindrop.io --allow-read=.env,data,content/bookmarks --allow-write=data/liked.yml,content/bookmarks --allow-env flat/raindrop-to-liked.ts
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          RAINDROP_FORCE: true
      - name: Sync to Arena
        run: deno run --allow-net=api.are.na --allow-read=.env,data --allow-write=data/synced_to_arena.yml --allow-env flat/export-to-arena.ts
        env:
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
      - name: Commit files
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add content/bookmarks/*
          git add data/*
          git commit -m "Sync the liked list" || echo "nothing to do and it is fine"
          git pull origin ${{ github.ref }}
          echo "push=true" >> $GITHUB_OUTPUT
        shell: bash
      - name: Push changes
        if: steps.commit.outputs.push == 'true'
        uses: ad-m/github-push-action@d91a481090679876dfc4178fef17f286781251df # v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
