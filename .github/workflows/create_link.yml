name: Create Link
on:
  workflow_dispatch:
    inputs:
        url:
          description: 'the url'
          required: true
        category:
          description: 'the category of link'
          required: false
          type: choice
          default: "article"
          options:
            - article
            - video
            - newsletter
            - podcast
            - shop
            - portfolio
            - other
        tags:
          description: 'tags'
          required: false
        notes:
          description: "notes"
          required: false
          type: string
jobs:
  build:
    name: create-link
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          # Not needed with a .ruby-version file
          ruby-version: 3.1.2
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - name: Set up Node.js ⚙️
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
      - name: Run links
        run: |
          ./bin/bookmark create --category=${{ github.event.inputs.category }} --notes="${{ github.event.inputs.notes }}" --tags=${{ github.event.inputs.tags }} ${{ github.event.inputs.url }}
      - name: Optimize Images
        run: |
          for file in $(find content/bookmarks/images \( -iname "*.jpg" -or -iname "*.jpeg" -or -iname "*.png" -or -iname "*.tif" -or -iname "*.bmp" \)) ; do
            convert ${file} -resize 1200x1200 -format webp ${file%.*}.webp;
          done
          rm -rf content/bookmarks/images/*.jpg
          rm -rf content/bookmarks/images/*.jpeg
          rm -rf content/bookmarks/images/*.png
      - name: Commit files
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add -A content/bookmarks
          git commit -m "imported sync"
          echo "push=true" >> $GITHUB_OUTPUT
        shell: bash
      - name: Push changes
        if: steps.commit.outputs.push == 'true'
        uses: ad-m/github-push-action@d91a481090679876dfc4178fef17f286781251df # v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

