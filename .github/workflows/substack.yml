name: Substack

on:
  push:
    paths:
      - .github/workflows/substack.yml # Only run a new workflow every time this file changes
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: "0 7 * * 1" # Every Monday at 7am UTC

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp
      - name: Import posts older than a week
        env:
          MAGICK: convert
        run: deno run --allow-net --allow-read --allow-write --allow-run --allow-env flat/substack.ts
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/posts
          git diff --staged --quiet || git commit -m "Import posts from Substack"
          git push
