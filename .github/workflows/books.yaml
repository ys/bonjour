name: Books

on:
  push:
    paths:
      - .github/workflows/books.yaml # Only run a new workflow every time this file changes
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: "30 5 * * *" # Daily at 5:30am UTC, before the 6am rebuild

jobs:
  scheduled:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Fetch Hardcover data
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: |
          # Script now automatically searches for missing covers using Amazon
          deno run --allow-net --allow-read --allow-write --allow-env --allow-import flat/hardcover.ts
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/books/*.yaml data/books/hardcover.json
          git diff --staged --quiet || git commit -m "Update books from Hardcover"
          git push
