title = "Bonjour Yannick"
theme = "simple"
locale = "en-US"
RemovePathAccents = true
timeout = 200000
enableRobotsTXT = true
canonifyURLs = false
# Category pages were thin and unlinked; categories stay in front matter for related posts and schema
disableKinds = ["taxonomy", "term"]
[security.exec]
  osEnv = [ '(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$', '^ASDF_DIR$', '^HOME$']
[build]
  writeStats = true
  [[build.cachebusters]]
    source = 'hugo_stats\\.json'
    target = 'css'
[params]
  locale = "en_US"
  images = ["card.jpg"]
  themePalette = "frappe"
  themeColors = [
    "red",
    "orange",
    "yellow",
    "green",
    "cyan",
    "blue",
    "purple",
    "magenta"
  ]
  backgroundColor = false
  ogURL = "https://og.yannickschutz.com"
  footer = " Be kind, rewind."
  text_404 = "Perdu?"
  mainSections = [ "posts", "photos" ]
  doNotIndex = ["bookmarks"]
  showFooter = ["posts", "photos"]
  showExif = ["details", "journal"]
  showCover = ["journal"]
  nonArchivable = ["bookmarks", "journal"]
  sizes = [ "2048" , "1024" , "512" ]
  description = "Documentary and lifestyle photographer based in Finistère, France. Available worldwide."
  copyright = "all rights reserved © • Be kind rewind"
  footerDescription = "Yannick Schutz is a documentary and lifestyle photographer based in Finistère, France, available worldwide. He loves coffee, surf & film photography."
  tags = ["famille", "bretagne", "voyage", "slow life", "photographies", "tranches de vie", "vie lente"]
  pinterestVerify = "fd6b8a37d3208b2c605434cf2ce71ac3"
  hasLogo = false
  emoji = "✌️"
  withEmoji = true
  arrow = "—"
  categorySymbol = "✺"
[params.shop]
  default_shipping_rate = "shr_1QqLdYFaA8Wpl3Epb9ZVfhP6"
[params.author]
  name = "Yannick Schutz"
  location = "Finistère, France"

[params.tinyletter]
  username = "bonjouryannick"
  title = "💌 Ma petite lettre"
  message = "Si tu aimes ce que tu as lu, j'envoie une petite lettre sur tout et rien toutes les deux semaines."

[params.categoriesColors]
  video = "yellow"
  article = "blue"
  link = "orange"
  audio = "magenta"
  image = "green"
  document = "red"

[params.indiekit]
  url = "https://bonjour-indie.herokuapp.com"

[params.social]
  email = "hello@yannickschutz.com"
  domain = "yannickschutz.com"
  instagram = "bonjouryannick"
  github = "ys"
  [params.social.mastodon]
    username = "yannick"
    domain = "social.lol"

[privacy]
  [privacy.disqus]
    disable = false
  [privacy.googleAnalytics]
    anonymizeIP = true
    disable = false
    respectDoNotTrack = true
  [privacy.instagram]
    disable = false
    simple = true
  [privacy.x]
    disable = false
    enableDNT = true
    simple = true
  [privacy.vimeo]
    disable = false
    enableDNT = true
    simple = true
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

[outputFormats.jsonfeed]
  mediaType = "application/json"
  baseName = "feed"
  isPlainText = true

[outputs]
  home = [ "html", "rss", "jsonfeed" ]
  section = [ "html", "rss", "jsonfeed" ]
  page = [ "html"]

[related]
  includeNewer = true

[[related.indices]]
  name = "categories"
  weight =  1 # We don't really need this, but omitting it would disable the indice.
[[related.indices]]
  name = "camera"
  weight =  4 # We don't really need this, but omitting it would disable the indice.
[[related.indices]]
  name = "film"
  weight =  4 # We don't really need thisfilm but omitting it would disable the indice.


[permalinks]
  posts = "/:slug"
  letters = "/:slug"
  photos = "/:section/:slug"
  portfolio = "/portfolio/:slug"
  categories = "/c/:slug"
  journal = "/:contentbasename"

[imaging]
  resampleFilter = "lanczos"
  anchor = "center"
[imaging.jpeg]
  quality = 85
[imaging.webp]
  quality = 85
# AVIF 65 keeps the film grain (compared side by side with WebP 85 on 2026-10-27)
[imaging.avif]
  quality = 65


# Only publish bundle files that templates actually use (resized images, videos, share cards)
[[cascade]]
  [cascade.build]
    publishResources = false

[taxonomies]
  category = "categories"

[markup.goldmark.renderer]
  unsafe= true

# Bulk edits made git dates useless as lastmod; only an explicit lastmod (or the post date) counts
[frontmatter]
  lastmod = ["lastmod", "date"]
